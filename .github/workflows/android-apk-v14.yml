name: VOP 1.4 - Gerar APK correto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Vivendo_o_Passado_v1_4_Android.zip'
      - '.github/workflows/android-apk-v14.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto 1.4
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Vivendo_o_Passado_v1_4_Android.zip"

          test -f "$ZIP"

          mkdir -p "$RUNNER_TEMP/vop"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/vop"

          ROOT="$RUNNER_TEMP/vop/vop_work"

          test -d "$ROOT"
          test "$(cat "$ROOT/VERSION")" = "1.4.0"

          test -f "$ROOT/web/index.html"
          test -f "$ROOT/web/catalog.js"
          test -f "$ROOT/android/settings.gradle"
          test -f "$ROOT/android/app/build.gradle"

          cp -a "$ROOT/." "$GITHUB_WORKSPACE/"

          echo "Versao 1.4.0 encontrada e extraida."

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
         

      - name: Aceitar licencas Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Copiar arquivos web
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

      - name: Verificar catalogo
        run: |
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/catalog.js
          echo "Catalogo da versao 1.4 confirmado."

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Verificar APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk.txt

          grep -q "versionName='1.4.0-debug'" /tmp/apk.txt

          echo "APK 1.4.0 validado!"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-v1.4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
