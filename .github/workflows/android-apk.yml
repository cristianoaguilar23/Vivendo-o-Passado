name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Vivendo_o_Passado_v1_4_Android.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto da versao 1.4
        run: |
          set -e

          if [ ! -f Vivendo_o_Passado_v1_4_Android.zip ]; then
            echo "ERRO: ZIP da versao 1.4 nao encontrado."
            exit 1
          fi

          mkdir -p /tmp/vop-extract

          unzip -q Vivendo_o_Passado_v1_4_Android.zip -d /tmp/vop-extract

          if [ ! -d /tmp/vop-extract/vop_work ]; then
            echo "ERRO: pasta vop_work nao encontrada."
            exit 1
          fi

          cp -a /tmp/vop-extract/vop_work/. "$GITHUB_WORKSPACE/"

          test -d web
          test -d android
          test -f android/settings.gradle
          test -f web/index.html

          echo "Projeto 1.4 extraido corretamente."

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Copiar arquivos da plataforma web
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

      - name: Verificar arquivos do aplicativo
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/www/index.html
          echo "Arquivos do aplicativo verificados."

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
