name: Vivendo o Passado - APK do pacote corrigido

'on':
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Vivendo_o_Passado_v1_5_2_CORRIGIDO.zip'
      - '.github/workflows/build-1.5.1-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair o pacote corrigido
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Vivendo_o_Passado_v1_5_2_CORRIGIDO.zip"
          test -s "$ZIP_FILE" || { echo "ZIP corrigido não encontrado na raiz do repositório."; exit 1; }
          mkdir -p "$RUNNER_TEMP/vop"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vop"
          SOURCE_DIR="$RUNNER_TEMP/vop/vop149"
          test -d "$SOURCE_DIR/android"
          test -d "$SOURCE_DIR/web"
          test -s "$SOURCE_DIR/VERSION"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Versão declarada no pacote: $(cat "$SOURCE_DIR/VERSION")"
          grep -n "versionName" "$SOURCE_DIR/android/app/build.gradle"

      - name: Aplicar arquivos do pacote corrigido
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/android" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/web" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/scripts" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/VERSION" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/README.md" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/CHANGELOG_1.5.1.md" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/.github/workflows/android-apk.yml" "$GITHUB_WORKSPACE/.github/workflows/android-apk.yml"
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          echo "MainActivity corrigida:"
          grep -n "View taggedView" android/app/src/main/java/com/cristianoaguilar/vivendoopassado/MainActivity.java
          echo "Versão:"
          cat VERSION

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK do pacote corrigido
        shell: bash
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Conferir identidade e publicar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK gerado:"
          ls -lh "$APK"
          echo "Versão do projeto:"
          cat VERSION
          grep -n "versionName" android/app/build.gradle

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-pacote-corrigido
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
