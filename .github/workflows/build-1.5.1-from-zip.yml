name: Vivendo o Passado 1.5.1 - APK a partir do ZIP

'on':
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Vivendo_o_Passado_v1_5_1_ANIMACOES_NOSTALGICAS.zip'
      - '.github/workflows/build-1.5.1-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair o ZIP 1.5.1
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Vivendo_o_Passado_v1_5_1_ANIMACOES_NOSTALGICAS.zip"
          test -s "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/vop151"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vop151"

          SOURCE_DIR="$RUNNER_TEMP/vop151/vop149"
          if [ ! -d "$SOURCE_DIR/android" ] || [ ! -d "$SOURCE_DIR/web" ]; then
            echo "Não encontrei android/ e web/ dentro de vop149/. Conteúdo extraído:"
            find "$RUNNER_TEMP/vop151" -maxdepth 4 -type d | sort
            exit 1
          fi
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Aplicar os arquivos do ZIP sem apagar o histórico
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/android" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/web" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/scripts" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/VERSION" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/README.md" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/CHANGELOG_1.5.1.md" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/.github/workflows/android-apk.yml" "$GITHUB_WORKSPACE/.github/workflows/android-apk.yml"
          test "$(cat VERSION)" = "1.5.1"
          grep -n "versionName '1.5.1'" android/app/build.gradle

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Copiar a plataforma web para o aplicativo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html

      - name: Compilar APK 1.5.1
        shell: bash
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Validar e publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-1.5.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
