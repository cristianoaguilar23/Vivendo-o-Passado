name: Vivendo o Passado 1.5.2 - APK oficial

'on':
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Vivendo_o_Passado_v1_5_2_CORRIGIDO.zip'
      - '.github/workflows/build-1.5.1-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair e validar pacote 1.5.2
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Vivendo_o_Passado_v1_5_2_CORRIGIDO.zip"
          test -s "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/vop152"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vop152"
          SOURCE_DIR="$RUNNER_TEMP/vop152/vop149"
          test -d "$SOURCE_DIR/android"
          test -d "$SOURCE_DIR/web"
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "1.5.2"
          grep -q "versionCode 20" "$SOURCE_DIR/android/app/build.gradle"
          grep -q "versionName '1.5.2'" "$SOURCE_DIR/android/app/build.gradle"
          ! grep -q 'tag.getParent()' "$SOURCE_DIR/android/app/src/main/java/com/cristianoaguilar/vivendoopassado/MainActivity.java"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Pacote validado: $(cat "$SOURCE_DIR/VERSION")"

      - name: Aplicar arquivos do pacote
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/android" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/web" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/scripts" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/VERSION" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/README.md" "$GITHUB_WORKSPACE/"
          cp -a "$SOURCE_DIR/CHANGELOG_1.5.2.md" "$GITHUB_WORKSPACE/"
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          echo "Versão final: $(cat VERSION)"
          grep -n "versionName '1.5.2'" android/app/build.gradle

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK 1.5.2
        shell: bash
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Validar e publicar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "Versão declarada: $(cat VERSION)"
          grep -n "versionName '1.5.2'" android/app/build.gradle

      - name: Publicar APK 1.5.2
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-1.5.2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
