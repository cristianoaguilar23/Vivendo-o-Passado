name: Gerar APK - Vivendo o Passado

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Organizar arquivos do projeto
        run: |
          set -e
          mkdir -p /tmp/vivendo
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Arquivo ZIP não encontrado"
            exit 1
          fi
          unzip -o "$ZIP" -d /tmp/vivendo
          cp -a /tmp/vivendo/. .

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar arquivos web
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

      - name: Compilar aplicativo
        run: |
          gradle --no-daemon -p android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivendo-o-Passado-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
