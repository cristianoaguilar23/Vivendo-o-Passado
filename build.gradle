plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cristianoaguilar.vivendoopassado'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cristianoaguilar.vivendoopassado'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '1.5.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
